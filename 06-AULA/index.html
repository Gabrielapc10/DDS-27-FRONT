<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tabelas  -->
    <header>
        <h1> Tabelas </h1>
    </header>

    <main>
        <h2> Produtos </h2>
        <!-- table = criação da tabela -->
         <!-- border = propriedade de borda da tabela -->
        <table border="5">
            <!-- thead = cabeçalho da tabela -->
            <thead>
                <!-- tr = criação de uma linha da tabela -->
                <tr>
                    <!-- th = coluna de um cabeçalho -->
                    <th> ID </th>
                    <th> NOME </th>
                    <th> QUANTIDADE </th>
                    <th> PREÇO </th>
                    <th> CATEGORIA </th>
                </tr>
            </thead>
            <!-- tbody =  corpo da tabela  -->
            <tbody>
                <tr>
                    <!-- td = celula da linha do corpo -->
                    <td> 1 </td>
                    <td> Shampoo </td>
                    <td> 7 </td>
                    <td> R$ 77 </td>
                    <td> Beleza </td>
                </tr>
                <tr>
                    <td> 2 </td>
                    <td> Refrigerante </td>
                    <td> 2 </td>
                    <td> R$ 20 </td>
                    <td> Bebida </td>
                </tr>
                <tr>
                    <!-- td = celula da linha do corpo -->
                    <td> 3 </td>
                    <!-- colspan = diz quantas colunas a celula vai ocupar -->
                    <td colspan="3"> Mucilon </td>
                    <!-- rowspan = diz quantas linha a celula vai ocupar   -->
                    <td rowspan="2"> Filhos  </td>
                </tr>
                <tr>
                    <td> 4 </td>
                    <td> Lavador nasal</td>
                    <td> 1 </td>
                    <td> R$ 30 </td>
                </tr>
            </tbody>
            <!-- tfoot = rodape da tabela -->
            <tfoot>
                <tr>
                    <td colspan="5"> Tabela feita por: mim</td>
                </tr>
            </tfoot>
        </table>
    </main>

    <footer>
        <p> Segue </p>
    </footer>
</body>
</html>
