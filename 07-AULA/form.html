<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <!-- fieldset = segmenta visualmente o formulario -->
        <fieldset>
            <!-- legend = titulo do segmento -->
            <legend> Dados pessoais </legend>

            <!-- caixinha de nome -->
            <label for="nome"> Nome: </label>
            <input type="text" name="nome" id="nome">

            <br><br>

            <!-- caixinha de nascimento -->
            <label for=""> Data de nascimento: </label>
            <!-- date = apenas data -->
            <input type="date" name="" id="">
            <!-- datetime-local = data e hora juntos  -->
            <input type="datetime-local">
            <!-- time = apenas hora -->
            <input type="time">
            <!-- fim caixinha data de nascimento -->

            <br><br>

            <!-- caixinha de numeros  -->
            <label for="filhos"> Quantidade de filhos: </label>
            <input type="number" name="filhos" id="filhos" min="-3" max="301" step="0.7" value="5">
            <!-- fim caixinha de numeros -->

        </fieldset>


    </form>


</body>
</html>
